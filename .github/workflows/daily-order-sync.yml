name: Daily Order Sync

on:
  workflow_dispatch:
  schedule:
    # 5:00 PM America/Chicago. GitHub cron is UTC; adjust during DST if needed.
    - cron: "0 22 * * 1-5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client openpyxl python-dateutil

      - name: Restore Gmail credentials
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          mkdir -p data/cache/secrets
          printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > data/cache/secrets/google-oauth-client.json
          printf '%s' "$GOOGLE_OAUTH_TOKEN_JSON" > data/cache/secrets/google-oauth-token.json
          chmod 600 data/cache/secrets/*.json

      - name: Validate Gmail credentials
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          client_path = Path("data/cache/secrets/google-oauth-client.json")
          token_path = Path("data/cache/secrets/google-oauth-token.json")
          client = json.loads(client_path.read_text())
          token = json.loads(token_path.read_text())
          if not (client.get("installed") or client.get("web")):
              raise SystemExit("GOOGLE_OAUTH_CLIENT_JSON is not a valid OAuth client JSON")
          required = {"refresh_token", "token_uri", "client_id", "client_secret"}
          missing = sorted(required - token.keys())
          if missing:
              raise SystemExit("GOOGLE_OAUTH_TOKEN_JSON is missing: " + ", ".join(missing))
          PY

      - name: Run daily sync
        run: |
          python scripts/fetch_emails.py
          python scripts/group_threads.py
          python scripts/match_orders.py
          python scripts/classify_status.py
          python scripts/update_sheet.py
          python scripts/generate_report.py

      - name: Commit updates
        run: |
          git config user.name "order-agent"
          git config user.email "order-agent@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No order updates to commit."
          else
            git commit -m "Daily order sync: $(date +%F)"
            git push
          fi
